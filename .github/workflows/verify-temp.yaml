name: Verify (temporary)

on:
  push:
    branches:
      - chore/puma7-jqueryui-ci84
    paths:
      - '.github/workflows/verify-temp.yaml'

env:
  RAILS_ENV: test
  NODE_ENV: test
  DB_PORT: 33306
  DB_USER: root
  DB_PASSWORD: root

jobs:
  deprecations:
    name: RSpec with -W:deprecated
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16.19.0"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - name: Setup database
        run: |
          cp config/database.github-actions.yml config/database.yml
          cp config/server.yml.example config/server.yml
          bundle exec rails db:create db:schema:load
      - name: RSpec with RUBYOPT=-W:deprecated
        run: |
          ./bin/yarn install
          ./bin/rails test:prepare
          set +e
          RUBYOPT=-W:deprecated bundle exec rspec spec --tag ~pending --order rand --format progress --format json --out tmp/rspec.json 2> tmp/stderr.txt
          rc=$?
          set -e
          echo "::notice title=rspec::$(jq -r '.summary_line' tmp/rspec.json) (exit $rc)"
          echo "::notice title=stderr lines::$(wc -l < tmp/stderr.txt)"
          grep -iE "deprecat|warning" tmp/stderr.txt | sed -E 's/:[0-9]+:/:N:/' | sort | uniq -c | sort -rn | head -40 | while read -r l; do echo "::warning title=stderr::${l:0:400}"; done
          tail -15 tmp/stderr.txt | while read -r l; do echo "::warning title=stderr tail::${l:0:400}"; done
          n=$(grep -ciE "deprecat" tmp/stderr.txt || true)
          echo "::notice title=deprecation lines::$n"
          [ "$rc" = 0 ] && [ "$n" = 0 ]

  production_image:
    name: Production image check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start MySQL 8.4
        run: |
          docker network create antcat
          docker run -d --name antcat-db --network antcat -e MYSQL_ROOT_HOST=% -e MYSQL_ROOT_PASSWORD=pw mysql:8.4 --mysql-native-password=ON
          docker build -t antcat-app dockerized_app
          for i in $(seq 1 60); do docker exec antcat-db mysqladmin -uroot -ppw ping --silent && break; sleep 2; done
      - name: startup.sh steps in RAILS_ENV=production
        run: |
          set -o pipefail
          cp config/settings/production.secret.yml.example config/settings/production.secret.yml
          docker run -d --name antcat-app --network antcat \
            -e RAILS_ENV=production -e DB_USERNAME=root -e DB_PASSWORD=pw -e DB_DATABASE=antcat \
            -e DB_PORT=3306 -e DB_HOST=antcat-db -e NO_DEV_MONKEY_PATCHES=y \
            -v "$PWD":/app -v "$PWD/dockerized_app/database.yml":/app/config/database.yml \
            -v "$PWD/config/server.yml.example":/app/config/server.yml \
            antcat-app sleep infinity
          x() { docker exec -e DISABLE_DATABASE_ENVIRONMENT_CHECK=1 antcat-app bash -c "$1" > out.txt 2>&1 || { grep -iE "error|fail|warn" out.txt | head -15 | while read -r l; do echo "::error title=$2 (grep)::${l:0:400}"; done; tail -25 out.txt | while read -r l; do echo "::error title=$2::${l:0:400}"; done; exit 1; }; tail -3 out.txt | while read -r l; do echo "::notice title=$2::${l:0:300}"; done; }
          x "chown -R antcat:antcat /app && cd /app && bundle config set --local path vendor/bundle && bundle install" "bundle install"
          x "cd /app && yarn install" "yarn install"
          x "cd /app/app && bundle exec rake assets:precompile" "assets:precompile"
          x "cd /app && ls public/assets/jquery-ui/widgets/ && grep -l 'jQuery UI Autocomplete 1.14.2\|autocomplete' public/assets/jquery-ui/widgets/autocomplete-*.js && grep -o 'jQuery UI [A-Za-z]* 1\.[0-9.]*' public/assets/jquery-ui/widgets/autocomplete-*.js | sort -u; ls public/assets/jquery-ui/core-* 2>&1 || true" "jquery-ui asset"
          x "cd /app && bundle exec rails db:create db:schema:load" "db:schema:load"
          x "cd /app && bundle exec rails runner 'Rails.application.eager_load!; puts \"eager_load ok, puma #{Puma::Const::PUMA_VERSION rescue :na}\"'" "eager-load boot"
          docker exec -d antcat-app bash -c "cd /app/app && bundle exec rails s -p 8080 -b '0.0.0.0' > /tmp/rails-s.log 2>&1"
          code=000
          for i in $(seq 1 60); do code=$(docker exec antcat-app curl -s -o /tmp/page.html -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:8080/catalog/search || true); [ "$code" = 200 ] && break; sleep 2; done
          docker exec antcat-app head -20 /tmp/rails-s.log | while read -r l; do echo "::notice title=rails s::${l:0:300}"; done
          echo "::notice title=GET /catalog/search::HTTP $code"
          [ "$code" = 200 ] || { docker exec antcat-app tail -30 /tmp/rails-s.log | while read -r l; do echo "::error title=rails s::${l:0:400}"; done; exit 1; }
          js=$(docker exec antcat-app grep -o '/assets/jquery-ui/widgets/autocomplete-[a-f0-9]*\.js' /tmp/page.html | head -1)
          echo "::notice title=autocomplete tag::$js"
          c2=$(docker exec antcat-app curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' "http://localhost:8080$js")
          echo "::notice title=GET autocomplete js::HTTP $c2"
          c3=$(docker exec antcat-app curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' "http://localhost:8080/authors/autocomplete.json?term=a")
          echo "::notice title=GET /authors/autocomplete.json::HTTP $c3"
          docker exec antcat-app curl -sI -H 'X-Forwarded-Proto: https' http://localhost:8080/catalog/search | head -12 | while read -r l; do echo "::notice title=headers::${l:0:200}"; done
          [ -n "$js" ] && [ "$c2" = 200 ] && [ "$c3" = 200 ]
