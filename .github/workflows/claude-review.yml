name: Claude review

# An automatic, independent code review of every pull request into master by Claude.
# .github/scripts/claude_review.py sends the PR diff to the Anthropic Messages API in one
# request and posts the answer as one PR comment ("Claude review"), edited on every new push.
# Skipped for drafts, for "Do not merge" PRs (temporary combined staging builds), for PRs
# from forks, and when the ANTHROPIC_API_KEY repository secret is missing.
# Cost guard: one API request per push (diff capped at 150k characters, answer at 4000
# tokens); a new push cancels the review still running for the older commit.
# Model, tokens and estimated cost are in the run's job summary.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches:
      - master

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.title, 'Do not merge') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check that the API key secret exists
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret is not set; skipping the Claude review."
          fi

      - name: Checkout the review script
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MODEL: claude-opus-5-5
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_CONTEXT: >-
            AntCat (www.antcat.org), the global ant taxonomic catalog. Ruby 4, Rails 8.1, MySQL 8.4,
            Solr, nginx and Puma in Docker (production config in dockerized_app/). Its nightly
            export feeds AntWeb, so a change to the export format or to taxon/name data can break
            AntWeb's import. Tests are RSpec; RuboCop and Brakeman run in CI.
        run: python3 -I .github/scripts/claude_review.py
