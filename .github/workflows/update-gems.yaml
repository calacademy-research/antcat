# One-time helper (2026-10-13): security gem updates within current major versions.
# Runs bundle update and commits Gemfile.lock. Delete before merging.
name: Update gems (one-time)
on:
  push:
    branches: [chore/security-gem-updates]
    paths: [.github/workflows/update-gems.yaml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.1
          bundler-cache: false
      - name: bundle update
        run: |
          gem install bundler -v 2.6.6
          bundle _2.6.6_ config set --local frozen false
          bundle _2.6.6_ update --conservative rails rack websocket-driver crass rack-session nokogiri net-imap faraday concurrent-ruby uri
          git --no-pager diff --stat Gemfile.lock
          grep -E "^    (rails|rack|websocket-driver|crass|rack-session|nokogiri|net-imap|faraday|concurrent-ruby|uri) \(" Gemfile.lock
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "bundle update: rails 7.1.5.2, rack, websocket-driver, crass, rack-session, nokogiri, net-imap, faraday, concurrent-ruby, uri (security)"
          git push origin HEAD:chore/security-gem-updates
