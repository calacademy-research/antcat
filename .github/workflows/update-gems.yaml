name: Update gems (one-time)

on:
  push:
    branches:
      - chore/rails-7.2
    paths:
      - '.github/workflows/update-gems.yaml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rails-7.2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.1
          bundler-cache: false
      - name: bundle update
        run: |
          gem install bundler -v 2.6.6
          bundle _2.6.6_ config set --local frozen false
          bundle _2.6.6_ update --conservative rails 2>&1 | tee /tmp/bundle.log
          git diff --stat
          git diff Gemfile.lock | grep -E '^[-+]    [a-z]' | sed 's/^/::notice::/' | head -45 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "bundle update --conservative rails (Rails 7.2)"
          git push origin HEAD:chore/rails-7.2
