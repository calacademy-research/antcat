name: RuboCop autocorrect (one-time)

on:
  push:
    branches:
      - chore/gem-updates-2026-10
    paths:
      - '.github/workflows/update-gems.yaml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/gem-updates-2026-10
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - name: autocorrect
        run: |
          bundle exec rubocop -a --only Rails/HttpStatusNameConsistency,Layout/HeredocIndentation,Capybara/RSpec/HaveContent,Rails/RedirectBackOrTo,Style/HashAsLastArrayItem,Style/EmptyClassDefinition,Style/ItBlockParameter,Layout/ExtraSpacing,Layout/EmptyLinesAfterModuleInclusion > /dev/null || true
          bundle exec rubocop -A --only Style/DirectiveScope > /dev/null || true
          { echo "== remaining offenses"; bundle exec rubocop --format emacs 2>&1; echo "== diffstat"; git diff --stat; } > rubocop-report.txt || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q .github
          git commit -m "rubocop -a (safe cops) and -A Style/DirectiveScope"
          git push origin HEAD:chore/gem-updates-2026-10
