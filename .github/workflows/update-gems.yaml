name: Gem update + MySQL 8.4 schema dump (one-time)

on:
  push:
    branches:
      - chore/puma7-jqueryui-ci84
    paths:
      - '.github/workflows/update-gems.yaml'

permissions:
  contents: write

env:
  DB_PORT: 33306
  DB_USER: root
  DB_PASSWORD: root

jobs:
  update:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/puma7-jqueryui-ci84
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler: 2.7.2
          bundler-cache: false
      - name: Report
        run: |
          mkdir -p ci-report
          R=ci-report/update-gems.txt
          git show HEAD~1:Gemfile > /tmp/Gemfile.orig
          cp Gemfile /tmp/Gemfile.new
          cp /tmp/Gemfile.orig Gemfile
          bundle config set --local path vendor/bundle
          { echo "== bundle install (old Gemfile)"; bundle install --quiet 2>&1 | tail -5; } >> $R
          { echo "== bundle-audit BEFORE"; bundle exec bundle-audit check --update 2>&1; } >> $R || true
          cp /tmp/Gemfile.new Gemfile
          { echo "== bundle update --conservative puma jquery-ui-rails"; bundle update --conservative puma jquery-ui-rails 2>&1 | tail -20; } >> $R || true
          { echo "== Gemfile.lock diff"; git diff Gemfile.lock; } >> $R
          { echo "== bundle-audit AFTER"; bundle exec bundle-audit check --update 2>&1; } >> $R || true
          { echo "== remote versions"; gem list -r -a '^puma$' 2>&1; gem list -r -a '^jquery-ui-rails$' 2>&1; } >> $R || true
          cp config/database.github-actions.yml config/database.yml
          cp config/server.yml.example config/server.yml
          { echo "== migrations on MySQL 8.4"; RAILS_ENV=development bundle exec rails db:drop db:create db:migrate 2>&1 | tail -40; } >> $R || true
          { echo "== schema.rb diff on 8.4"; git diff db/schema.rb; } >> $R
          { echo "== mysql version"; mysql -h127.0.0.1 -P33306 -uroot -proot -e 'select version(), @@character_set_server, @@collation_server' 2>&1; } >> $R || true
          git checkout -- config/database.yml config/server.yml 2>/dev/null || rm -f config/database.yml config/server.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock ci-report db/schema.rb
          git commit -m "bundle update --conservative puma jquery-ui-rails; MySQL 8.4 schema dump (one-time job)"
          git push origin HEAD:chore/puma7-jqueryui-ci84
