name: Update gems (one-time)

on:
  push:
    branches:
      - chore/rails-8.0
    paths:
      - '.github/workflows/update-gems.yaml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rails-8.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.1
          bundler-cache: false
      - name: bundle update
        run: |
          gem install bundler -v 2.6.6
          bundle _2.6.6_ config set --local frozen false
          set +e
          bundle _2.6.6_ update --conservative rails > /tmp/bundle.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -v '^\s*$' /tmp/bundle.log | tail -60 | cut -c1-200 | paste -sd'~' - | fold -w 950 | head -10 | sed 's/^/::error::/'
            exit 1
          fi
          git diff Gemfile.lock | grep -E '^[-+]    [a-z]' | paste -sd' ' - | fold -w 950 | head -5 | sed 's/^/::notice::/'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "bundle update --conservative rails"
          git push origin HEAD:chore/rails-8.0
