name: Main

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

env:
  RAILS_ENV: test
  NODE_ENV: test

  DB_PORT: 33306
  DB_USER: root
  DB_PASSWORD: root

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "16.19.0"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.1
          bundler-cache: true

      - name: Run eslint
        run: |
          ./bin/yarn install
          ./bin/yarn lint

      - name: Run rubocop
        run: |
          bundle exec rubocop --format progress --format github

  rspec:
    name: RSpec (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    # MySQL 8.4 is a trial run ahead of the planned upgrade; it may fail without blocking.
    continue-on-error: ${{ matrix.mysql != '5.7' }}
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7', '8.4']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "16.19.0"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.1
          bundler-cache: true

      - name: Setup database
        run: |
          cp config/database.github-actions.yml config/database.yml
          cp config/server.yml.example config/server.yml


          bundle exec rails db:create db:schema:load

      - name: Run rspec
        run: |
          ./bin/yarn install
          ./bin/rails test:prepare
          mkdir -p tmp
          bundle exec rspec spec --tag ~pending --order rand --format progress --format json --out tmp/rspec.json 2>tmp/rspec-stderr.log

      - name: TEMP deprecation summary
        if: always()
        run: |
          echo "::warning::DEPRECATION lines: $(grep -c DEPRECATION tmp/rspec-stderr.log || true); stderr lines: $(wc -l < tmp/rspec-stderr.log)"
          head -c 800 tmp/rspec-stderr.log | paste -sd'~' - | sed 's/^/::notice::stderr head: /'
          grep -h DEPRECATION tmp/rspec-stderr.log | sed -E 's/\(called from .*//' | cut -c1-280 | sort | uniq -c | sort -rn | head -9 | while read -r line; do echo "::warning::$line"; done
          grep -h -A1 DEPRECATION tmp/rspec-stderr.log | grep -oE 'called from [^ ]+' | sort | uniq -c | sort -rn | head -9 | while read -r line; do echo "::notice::$line"; done
          grep -hv DEPRECATION tmp/rspec-stderr.log | grep -iE 'warn|deprecat' | cut -c1-280 | sort | uniq -c | sort -rn | head -9 | while read -r line; do echo "::notice::other: $line"; done

      - name: Show failing specs as annotations
        if: failure()
        run: |
          jq -r '.summary_line' tmp/rspec.json | sed 's/^/::error::/'
          jq -r '.examples[]|select(.status=="failed")|.exception.class+": "+((.exception.message // "")|split("\n")|map(select(length>0))|.[0] // "")[0:300]' tmp/rspec.json | sort | uniq -c | sort -rn | head -8 | while read -r line; do echo "::error::$line"; done

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.1
          bundler-cache: true

      - name: Setup database
        run: |
          cp config/database.github-actions.yml config/database.yml
          cp config/server.yml.example config/server.yml


      - name: Run migrations (up)
        run: |
          RAILS_ENV=development ./spec/migrations/test_migrations_up

      - name: TEMP production boot and assets
        run: |
          cp config/settings/production.secret.yml.example config/settings/production.secret.yml
          sed -n '/^test:/,$p' config/database.github-actions.yml | sed 's/^test:/production:/' >> config/database.yml
          RAILS_ENV=development bundle exec rails db:create db:schema:load 2>&1 | grep -i deprecat | sed 's/^/::warning::dev schema load: /' | head -5 || true
          ./bin/yarn install
          RAILS_ENV=production bundle exec rails runner 'Rails.application.eager_load!; puts "::notice::production boot ok, Rails #{Rails.version}, #{Taxon.count} taxa"' 2>&1 | tee tmp/prod.log
          RAILS_ENV=production bundle exec rails assets:precompile 2>&1 | tail -3 | sed 's/^/::notice::precompile: /'
          grep -i deprecat tmp/prod.log | head -5 | sed 's/^/::warning::/' || true

      - name: TEMP schema diff
        if: failure()
        run: |
          git diff db/schema.rb | grep -E '^[-+][^-+]' | sed -E 's/ +/ /g' | head -80 | paste -sd'~' - | fold -w 900 | head -10 | while read -r line; do echo "::error::$line"; done
