name: Main

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

env:
  RAILS_ENV: test
  NODE_ENV: test

  DB_PORT: 33306
  DB_USER: root
  DB_PASSWORD: root

jobs:

  security:
    name: Security scan (brakeman, bundler-audit)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true

      - name: Brakeman (report)
        run: |
          bundle exec brakeman --no-pager --quiet --format text --output /tmp/brakeman.txt || true
          { echo '### Brakeman'; echo '```'; cat /tmp/brakeman.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/brakeman.txt

      - name: bundler-audit (report)
        run: |
          bundle exec bundle-audit check --update > /tmp/audit.txt 2>&1 || true
          { echo '### bundler-audit'; echo '```'; cat /tmp/audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/audit.txt
  rubocop:
    name: RuboCop
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true

      - name: Run eslint
        run: |
          ./bin/yarn install --frozen-lockfile
          ./bin/yarn lint

      - name: Build JavaScript and CSS (fails on any warning, including Sass deprecations)
        run: |
          log="$RUNNER_TEMP/build-assets.log"
          ./bin/yarn build --log-level=warning 2> "$log" || true
          ./bin/yarn build:css 2>> "$log" || true
          # Tailwind prints a banner and timing to stderr, so look for actual warnings/errors.
          if grep -qiE "warning|error|deprecat" "$log"; then
            cat "$log"
            grep -m 10 -iE "warning|error" "$log" | sed 's/^/::error title=Asset build::/'
            exit 1
          fi

      - name: Run rubocop
        run: |
          bundle exec rubocop --format progress --format github

  rspec:
    name: RSpec (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.4']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true

      - name: Setup database
        run: |
          cp config/database.github-actions.yml config/database.yml
          cp config/server.yml.example config/server.yml


          bundle exec rails db:create db:schema:load

      - name: Start Solr 10 (core `test` from solr/configsets/antcat)
        run: |
          docker run -d --name solr -p 8981:8983 -e SOLR_MODE=user-managed \
            -v "$GITHUB_WORKSPACE/solr/configsets/antcat:/configsets/antcat:ro" \
            solr:10.0 solr-precreate test /configsets/antcat
          for i in $(seq 1 60); do curl -fs http://localhost:8981/solr/test/admin/ping > /dev/null && break; sleep 2; done
          if ! curl -fs http://localhost:8981/solr/test/admin/ping; then
            docker logs solr 2>&1 | tail -60
            docker logs solr 2>&1 | grep -E "ERROR|Exception|Caused by" | head -10 | sed 's/^/::error title=Solr::/'
            exit 1
          fi

      - name: Run rspec
        run: |
          ./bin/yarn install --frozen-lockfile
          ./bin/rails test:prepare
          bundle exec rspec spec --tag ~pending --order rand --format progress --format json --out tmp/rspec.json

      # `:js` specs run in headless Chrome via Cuprite (Google Chrome is preinstalled on GitHub's Ubuntu
      # runners). Shows how many ran and fails the job if none passed, so they cannot be skipped silently.
      - name: Report browser specs (headless Chrome)
        if: always()
        run: |
          chrome="$(google-chrome --version 2>/dev/null || echo 'Google Chrome not found')"
          passed=0
          summary="no browser specs ran"
          if [ -s tmp/js_example_ids.txt ] && [ -f tmp/rspec.json ]; then
            filter='($ids | split("\n") | map(select(length > 0))) as $js | [.examples[] | select(.id | IN($js[]))]'
            summary="$(jq -r --rawfile ids tmp/js_example_ids.txt "$filter | group_by(.status) | map(\"\(length) \(.[0].status)\") | join(\", \")" tmp/rspec.json)"
            passed="$(jq -r --rawfile ids tmp/js_example_ids.txt "$filter | map(select(.status == \"passed\")) | length" tmp/rspec.json)"
          fi
          echo "::notice title=Browser specs::${chrome}: ${summary}"
          { echo '### Browser specs (headless Chrome)'; echo "${chrome}: ${summary}"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ]; then
            echo "::error title=Browser specs::No browser (:js) spec passed; is Chrome available to Cuprite?"
            exit 1
          fi

      - name: Show failing specs as annotations
        if: failure()
        run: |
          docker logs solr 2>&1 | grep -E "ERROR|Caused by" | sort | uniq -c | sort -rn | head -5 | sed 's/^/::error title=Solr::/' || true
          jq -r '.summary_line' tmp/rspec.json | sed 's/^/::error::/'
          jq -r '.examples[]|select(.status=="failed")|.exception.class+": "+((.exception.message // "")|split("\n")|map(select(length>0))|.[0] // "")[0:300]' tmp/rspec.json | sort | uniq -c | sort -rn | head -8 | while read -r line; do echo "::error::$line"; done
          jq -r '.examples[]|select(.status=="failed")|"\(.file_path):\(.line_number) \(.full_description)"[0:400]' tmp/rspec.json | head -8 | while read -r line; do echo "::error title=Failed spec::$line"; done
          jq -r '.examples[]|select(.status=="failed")|(.exception.message // "")|gsub("\n";" ")|.[300:1500]' tmp/rspec.json | head -3 | while read -r line; do echo "::error title=Failure detail::$line"; done

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true

      - name: Setup database
        run: |
          cp config/database.github-actions.yml config/database.yml
          cp config/server.yml.example config/server.yml


      - name: Run migrations (up)
        run: |
          RAILS_ENV=development ./spec/migrations/test_migrations_up
