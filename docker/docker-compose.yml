version: "3.7"
services:
  antcat:
    build:
      context: ../
      dockerfile: ./docker/antcat-database.docker
    command: /bin/bash
    depends_on:
      - "db"
    environment:
      RAILS_ENV: "development"
      # Uncomment for quicker testing.
      # AW_EXPORT_LIMIT: "500"
    volumes:
      - ../:/code
    stdin_open: true
    tty: true
    networks:
      antcat-network:

  db:
    # Throwaway database for the AntWeb export (antcat-export droplet). MySQL 8.4 since 2026-10,
    # ahead of antcat.org's own move from 5.6; a 5.6 dump loads into 8.4.
    image: mysql:8.4
    command: --mysql-native-password=ON
    expose:
      - "3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD="true"
      - MYSQL_DATABASE=antcat
    networks:
      antcat-network:

networks:
  antcat-network:
