# Production stack for antcat.org (droplet antcat-prod, checkout at /var/www/antcat-2).
# Database passwords come from dockerized_app/.env (not in git):
#   ANTCAT_DB_PASSWORD=...        (MySQL root, used only by the db container)
#   ANTCAT_APP_DB_USER=...        (the app's own MySQL account)
#   ANTCAT_APP_DB_PASSWORD=...
services:
  db:
    # MySQL 8.4 since 2026-10 (was mysql/mysql-server:5.6, data kept in /mnt/volume_sfo3_01/mysql).
    image: mysql:8.4
    command: --mysql-native-password=ON
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_HOST=%
      - MYSQL_ROOT_PASSWORD=${ANTCAT_DB_PASSWORD:?set ANTCAT_DB_PASSWORD in dockerized_app/.env}
      # Fresh setup only: on its first start with an empty data directory, MySQL creates the database `antcat`
      # and the app's account (the same .env values the app uses) with all rights on that database, before it
      # loads mysql84-init. With an existing data directory (production) MySQL ignores these three.
      - MYSQL_DATABASE=antcat
      - MYSQL_USER=${ANTCAT_APP_DB_USER:?set ANTCAT_APP_DB_USER in dockerized_app/.env}
      - MYSQL_PASSWORD=${ANTCAT_APP_DB_PASSWORD:?set ANTCAT_APP_DB_PASSWORD in dockerized_app/.env}
    expose:
      - "3306"
    container_name: antcat-db
    volumes:
      # Only used when the data directory is empty (first start): load a dump placed in ./mysql84-init
      - ./mysql84-init:/docker-entrypoint-initdb.d
      - /mnt/volume_sfo3_01/mysql84:/var/lib/mysql
    networks:
      - antcat-network

  # Search engine for Sunspot (catalog/reference searches and autocompletes). Solr 10 since 2026-10;
  # was Solr 4 started inside the app container by the sunspot_solr gem.
  # The core `default` is created from ../solr/configsets/antcat on the first start only. After a
  # schema change: `docker compose rm -sf solr && docker volume rm dockerized_app_solr-data`,
  # `docker compose up -d solr`, then reindex (`bundle exec rake sunspot:reindex` in the app container).
  solr:
    image: solr:10.0
    restart: unless-stopped
    container_name: antcat-solr
    environment:
      SOLR_MODE: user-managed
      # The index is ~50 MB; 256 MB heap leaves memory for Puma workers (antcat-prod has 4 GB).
      SOLR_HEAP: ${ANTCAT_SOLR_HEAP:-256m}
    volumes:
      - ../solr/configsets/antcat:/configsets/antcat:ro
      - solr-data:/var/solr
    command: ["solr-precreate", "default", "/configsets/antcat"]
    expose:
      - "8983"
    networks:
      - antcat-network

  app:
    depends_on:
      - db
      - solr
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      # The app's own MySQL account (rights on the antcat database only), from dockerized_app/.env.
      # There is no fallback to the MySQL root account: compose refuses to start without them.
      DB_USERNAME: ${ANTCAT_APP_DB_USER:?set ANTCAT_APP_DB_USER in dockerized_app/.env}
      DB_PASSWORD: ${ANTCAT_APP_DB_PASSWORD:?set ANTCAT_APP_DB_PASSWORD in dockerized_app/.env}
      DB_DATABASE: antcat
      DB_PORT: 3306
      DB_HOST: db
      NO_DEV_MONKEY_PATCHES: "y"
      # Puma worker processes (config/puma.rb); 0 = single process. Set ANTCAT_WEB_CONCURRENCY in .env.
      WEB_CONCURRENCY: ${ANTCAT_WEB_CONCURRENCY:-0}
    volumes:
      - ..:/app
      - ./database.yml:/app/config/database.yml
      - ../config/server.yml.example:/app/config/server.yml
      # The checkout also holds server secrets the app does not need: the MySQL root password (.env)
      # and, under nginx/certbot, the Cloudflare DNS token and the TLS keys. They are covered here, so
      # the app container sees an empty .env and an empty nginx/certbot. Compose itself still reads the
      # real .env on the host; nginx and certbot mount their files directly.
      - /dev/null:/app/dockerized_app/.env:ro
      - type: tmpfs
        target: /app/dockerized_app/nginx/certbot
        tmpfs:
          size: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    expose:
      - "8080"
    container_name: antcat-app
    stdin_open: true
    tty: true
    command: ["/bin/bash", "-c", "dockerized_app/startup.sh"]
    networks:
      - antcat-network

  web:
    # Pinned to a stable release (was nginx:latest). To update: change the version here (stable
    # branch, nginx.org/en/download.html), then recreate `web` (see README.md in this directory).
    image: nginx:1.30.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/99-autoreload.sh:/docker-entrypoint.d/99-autoreload.sh
    depends_on:
      - app
    networks:
      - antcat-network

  certbot:
    restart: unless-stopped
    image: certbot/dns-cloudflare
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/cloudflare/credentials.ini:/etc/cloudflare/credentials.ini:ro
    environment:
      - APP_DOMAIN=antcat.org,www.antcat.org
      - EMAIL=jrussack@calacademy.org
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --dns-cloudflare --dns-cloudflare-credentials /etc/cloudflare/credentials.ini --dns-cloudflare-propagation-seconds 60; sleep 12h & wait $${!}; done;'"

volumes:
  solr-data:

networks:
  antcat-network:
    driver: bridge
