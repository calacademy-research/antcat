# dmz-shield mesh bans (enforced per request; see dmz-shield docs/cdn-members.md)
include /etc/letsencrypt/dmz-shield/http.conf;

limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Real visitor IP: antcat.org is behind Cloudflare. Only for connections from Cloudflare's address
# ranges, nginx replaces $remote_addr with the visitor's address from `CF-Connecting-IP`; the header
# is ignored on any other connection. Rails reads it from X-Forwarded-For (set below) as
# `request.remote_ip` (sign-in, sign-up, password reset and feedback limits).
# Ranges from https://www.cloudflare.com/ips/ (check when Cloudflare announces changes).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;
    server_tokens off;
    include /etc/letsencrypt/dmz-shield/server.conf;
    # Request bodies: forms and JSON are small. Only the reference form uploads files (PDFs, which
    # are stored on S3); it gets its own larger limit below.
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/antcat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antcat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Look up the app container's address at request time (Docker's internal DNS),
    # so recreating the app container doesn't leave nginx pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $antcat_app http://app:8080;

    # X-Forwarded-For is replaced (not appended to), so a client-sent value never reaches Rails.
    # Client-IP is cleared, since Rails also looks at it for `request.remote_ip`.
    location / {
        proxy_pass $antcat_app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Client-IP "";
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Reference create/update (POST /references, PATCH /references/:id) can upload a PDF.
    # Scanned monographs can be large; 100 MB is well above the PDFs AntCat stores.
    location ~ ^/references(/[0-9]+)?$ {
        client_max_body_size 100m;

        proxy_pass $antcat_app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Client-IP "";
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}
