# dmz-shield mesh bans (enforced per request; see dmz-shield docs/cdn-members.md)
include /etc/letsencrypt/dmz-shield/http.conf;

limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    listen [::]:80;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;
    server_tokens off;
    include /etc/letsencrypt/dmz-shield/server.conf;
    client_max_body_size 300M;

    ssl_certificate /etc/letsencrypt/live/antcat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antcat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Look up the app container's address at request time (Docker's internal DNS),
    # so recreating the app container doesn't leave nginx pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $antcat_app http://app:8080;

    location / {
        proxy_pass $antcat_app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}
