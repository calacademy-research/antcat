swagger: '2.0'

info:
  version: "1.10.0"
  title: AntCat REST API
  description: >-
    Read only API to access antcat.org. Terms, limits and how to cite: https://www.antcat.org/v1 and
    https://www.antcat.org/llms.txt. Free registered API keys (when live, see https://www.antcat.org/v1)
    are sent in the X-API-Key header and raise the limits; lists of all records need a key.
  # TODO: This shows up as "Created by Brian Fisher ... Contact the developer" but credit should go to Joe Russack.
  contact:
    name: Brian Fisher
    email: bfisher@calacademy.org

host: antcat.org
basePath: /v1
schemes: [https]
consumes: [application/json]
produces: [application/json]

securityDefinitions:
  ApiKey:
    type: apiKey
    in: header
    name: X-API-Key
security:
  - ApiKey: []
  - {}

paths:
  /taxa/{id}:
    get:
      summary: Get a single taxon
      operationId: getTaxon
      tags:
        - taxa
      parameters:
        - name: id
          in: path
          description: taxon id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single taxon record
          schema:
            $ref: '#/definitions/Taxon'
        "404":
          description: Record not found

  /taxa/search/{string}:
    get:
      summary: Search taxa using advanced search string
      operationId: searchTaxa
      tags:
        - taxa
        - search
      parameters:
        - name: string
          in: path
          description: Advanced search string
          required: true
          type: string
      responses:
        "200":
          description: matching taxa records
          schema:
            type: array
            items:
              $ref: '#/definitions/Taxa'
        "404":
          description: Record not found

  /taxa:
    get:
      summary: Get taxa
      operationId: getTaxa
      tags:
        - taxa
      parameters:
        - name: starts_at
          in: query
          description: Lowest taxon ID to be returned
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: Returns 100 taxa at a time starting at the specified taxon id. If no id is supplied, starts at zero
          schema:
            type: array
            items:
              $ref: '#/definitions/Taxon'
        "404":
          description: Record not found

  /protonyms:
    get:
      summary: Get all protonyms
      operationId: getProtonyms
      tags:
        - protonyms
      responses:
        "200":
          description: the first hundred citation records.
          schema:
            type: array
            items:
              $ref: '#/definitions/Protonym'
        "404":
          description: Record not found

  /protonyms/{id}:
    get:
      summary: Get a protonym
      operationId: getProtonym
      tags:
        - protonyms
      parameters:
        - name: id
          in: path
          description: protonym id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single protonym record
          schema:
            $ref: '#/definitions/Protonym'
        "404":
          description: Record not found

  /authors/{id}:
    get:
      summary: Get an author
      operationId: getAuthor
      tags:
        - authors
      parameters:
        - name: id
          in: path
          description: author id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single author record
          schema:
            type: array
            items:
              $ref: '#/definitions/Author'
        "404":
          description: Record not found

  /authors:
    get:
      summary: Get all authors
      operationId: getAuthors
      tags:
        - authors
      responses:
        "200":
          description: Array of Ids of all authors and their create/update dates
          schema:
            type: array
            items:
              $ref: '#/definitions/Author'
        "404":
          description: Record not found

  /author_names/{id}:
    get:
      summary: Get an author name by author id
      operationId: getAuthorName
      tags:
        - author_names
      parameters:
        - name: id
          in: path
          description: author id (not author NAME id!)
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single author name record
          schema:
            $ref: '#/definitions/AuthorName'
        "404":
          description: Record not found

  /author_names:
    get:
      summary: Get all author names
      operationId: getAuthorNames
      tags:
        - author_names
      responses:
        "200":
          description: Array of all author names
          schema:
            type: array
            items:
              $ref: '#/definitions/AuthorName'
        "404":
          description: Record not found

  /names/{id}:
    get:
      summary: Get an author name by author id
      operationId: getName
      tags:
        - names
      parameters:
        - name: id
          in: path
          description: name id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single taxon name record
          schema:
            $ref: '#/definitions/Name'
        "404":
          description: Record not found

  /names:
    get:
      summary: returns a maximum of 100 taxon names
      operationId: getNames
      tags:
        - names
      parameters:
        - name: starts_at
          in: query
          description: Lowest name ID to be returned
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: Array of all author names
          schema:
            type: array
            items:
              $ref: '#/definitions/Name'
        "404":
          description: Record not found

  /citations:
    get:
      summary: Get all citations
      operationId: getCitations
      tags:
        - citations
      parameters:
        - name: starts_at
          in: query
          description: Lowest citation ID to be returned
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: Returns 100 citations at a time starting at the specified citation id. If no id is supplied, starts at zero
          schema:
            type: array
            items:
              $ref: '#/definitions/Citation'
        "404":
          description: Record not found

  /citations/{id}:
    get:
      summary: Get a citation
      operationId: getCitation
      tags:
        - citations
      parameters:
        - name: id
          in: path
          description: citation id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single citation record
          schema:
            $ref: '#/definitions/Citation'
        "404":
          description: Record not found

  /history_items:
    get:
      summary: Get all history_items
      operationId: getHistoryItems
      tags:
        - history_items
      parameters:
        - name: starts_at
          in: query
          description: Lowest history_item id to be returned
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: Returns 100 history items at a time starting at the specified history_item_id id. If no id is supplied, starts at zero
          schema:
            type: array
            items:
              $ref: '#/definitions/HistoryItem'
        "404":
          description: Record not found

  /history_items/{id}:
    get:
      summary: Get a single history_item
      operationId: getHistoryItem
      tags:
        - history_items
      parameters:
        - name: id
          in: path
          description: getHistoryItem id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single getHistoryItem record
          schema:
            $ref: '#/definitions/HistoryItem'
        "404":
          description: Record not found

  /journals:
    get:
      summary: Get all journals
      operationId: getJournals
      tags:
        - journals
      parameters:
        - name: starts_at
          in: query
          description: Lowest journal id to be returned
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: Returns 100 journals at a time starting the specified journal id. If no id is supplied, starts at zero
          schema:
            type: array
            items:
              $ref: '#/definitions/Journal'
        "404":
          description: Record not found

  /journals/{id}:
    get:
      summary: Get a single journal
      operationId: getJournal
      tags:
        - journals
      parameters:
        - name: id
          in: path
          description: getJournal id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single journal record
          schema:
            $ref: '#/definitions/Journal'
        "404":
          description: Record not found

  /publishers:
    get:
      summary: Get all publishers
      operationId: getPublishers
      tags:
        - publishers
      parameters:
        - name: starts_at
          in: query
          description: Lowest publisher id to be returned
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: Returns 100 publishers at a time starting the specified publisher id. If no id is supplied, starts at zero
          schema:
            type: array
            items:
              $ref: '#/definitions/Publisher'
        "404":
          description: Record not found

  /publishers/{id}:
    get:
      summary: Get a single publisher
      operationId: getpublisher
      tags:
        - publishers
      parameters:
        - name: id
          in: path
          description: getpublisher id
          required: true
          type: integer
          format: int32
      responses:
        "200":
          description: a single publisher record
          schema:
            $ref: '#/definitions/Publisher'
        "404":
          description: Record not found

  /references:
    get:
      summary: Get all references
      operationId: getReferences
      tags:
        - references
      parameters:
        - name: starts_at
          in: query
          description: Lowest reference id to be returned
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: Returns 100 references at a time starting the specified reference id. If no id is supplied, starts at zero
          schema:
            type: array
            items:
              $ref: '#/definitions/Reference'
        "404":
          description: Record not found

  /references/{id}:
    get:
      summary: Get a single reference
      operationId: getreference
      tags:
        - references
      parameters:
        - name: id
          in: path
          description: getreference id
          required: true
          type: integer
          format: int32
      responses:
        "200":
