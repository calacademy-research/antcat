# `production_url` is used for links that are always targeted to production. `site_url` is for the current site (env-specific).
production_url: "https://antcat.org"

http_basic_auth:
  enabled: false
  name: ''
  password: ''

email:
  # Quickfix to disable emails because Google keeps blocking sign-in attempts after some inactivity.
  # Note that this config does not affect `Rails.application.config.action_mailer.perform_deliveries`.
  # TODO: Split per env.
  # TODO: Ctrl+F Settings.email.enabled
  # TODO: Probably use something like `config.action_mailer.perform_deliveries = Settings.email.enabled`, and/or
  # keep two different `Settings` configs for "enabled"/"perform_deliveries".
  enabled: false

github:
  repo_url: "https://github.com/calacademy-research/antcat"
  issues_url: "https://github.com/calacademy-research/antcat/issues"

catalog:
  # To make is easier to disable in case of performance issues.
  show_failed_soft_validations: true

editors_panel:
  max_featured_wiki_pages_links: 6

# Free registered API keys and the usage limits of /v1 (see `ApiAccess`). Off: the API works as before
# the keys (no key check, no counting) and the key registration form answers 404. To turn on, set
# `api_keys: enabled: true` in config/settings/production.secret.yml and restart the app.
# The limits without a key are counted per visitor address (`request.remote_ip`). Behind Cloudflare that is
# the visitor's own address, not Cloudflare's: nginx takes it from `CF-Connecting-IP` for connections from
# Cloudflare's ranges and passes it on (dockerized_app/nginx/default.conf; spec/requests/forwarded_headers_spec.rb).
# If nginx's `set_real_ip_from` list or `real_ip_header` is ever removed, every visitor behind one Cloudflare
# edge would share one limit: check before turning this on.
api_keys:
  enabled: false
  # A copy of each registration (when its key is issued) goes here.
  registration_copy_to: "bfisher@calacademy.org"

contact_us_email_address: "bfisher@calacademy.org"
suggest_edit_email_address: "bfisher@calacademy.org"
