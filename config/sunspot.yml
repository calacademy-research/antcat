# Production (antcat.org and antcat-staging): the `solr` container in dockerized_app/docker-compose.yml.
production:
  solr:
    hostname: solr
    port: 8983
    log_level: WARNING
    path: /solr/default

development:
  solr:
    hostname: localhost
    port: 8982
    log_level: INFO
    path: /solr/development

test:
  solr:
    hostname: localhost
    port: 8981
    log_level: WARNING
    path: /solr/test
